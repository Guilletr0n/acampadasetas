steps:
  # 1. Compilar la imagen Docker con el Dockerfile optimizado para Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/acampadasetas-web:$COMMIT_SHA'
      - '.'

  # 2. Subir la imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/acampadasetas-web:$COMMIT_SHA'

  # 3. Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'acampadasetas-web'
      - '--image'
      - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/acampadasetas-web:$COMMIT_SHA'
      - '--region'
      - 'europe-southwest1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=acampadasetas,GCS_BUCKET_NAME=acampadasetas-media'
      - '--port'
      - '8080'

images:
  - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/acampadasetas-web:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
